version: '3.8'

services:
  db:
    image: postgres:15
    container_name: todolist_db
    environment:
      POSTGRES_USER: parsa
      POSTGRES_PASSWORD: parsa123
      POSTGRES_DB: todolist
    ports:
      - "5433:5432"     # <<< host 5433 -> container 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
